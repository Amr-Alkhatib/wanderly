{# Four-colour bar: one segment per factor, sized by the points it contributed (they add up to the score). #}<span class="strata{% if dark %} on-dark{% endif %}" role="img" aria-label="Score breakdown: {% for f in sc.factors %}{{ f.name }} {{ f.points|floatformat:0 }}{% if not forloop.last %}, {% endif %}{% endfor %} points">{% for f in sc.factors %}<i class="strata-seg f-{{ f.name|lower }}" style="--p:{{ f.points|stringformat:'.2f' }}" title="{{ f.name }}: {{ f.points|floatformat:0 }} pts"></i>{% endfor %}</span>
