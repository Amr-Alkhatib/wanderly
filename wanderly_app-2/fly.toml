app = "wanderly-app"
primary_region = "fra"

[build]

[deploy]
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"
  [http_service.checks.headers]
    X-Forwarded-Proto = "https"
    Host = "wanderly-app.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"